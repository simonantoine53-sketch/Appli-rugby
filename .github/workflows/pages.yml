# Déploie l'éditeur sur GitHub Pages à chaque push sur main.
# L'étape configure-pages active Pages automatiquement si ce n'est pas déjà fait.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Version publiée allégée : scripts regroupés et minifiés dans _site/ (voir site.js)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save esbuild@0.24.0 && node site.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
